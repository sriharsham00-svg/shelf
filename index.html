<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--fg:#000;--mut:#8e8e93;--line:#d1d1d6;--blue:#007aff;--green:#34c759;--red:#ff3b30;--glass:rgba(249,249,249,.78);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--fg:#fff;--line:#38383a;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--glass:rgba(28,28,30,.74);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--fg:#fff;--line:#38383a;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--glass:rgba(28,28,30,.74);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:10}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
h1{font:700 34px/1.1 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:.35px;margin:4px 0 14px}
.tb{background:none;border:0;color:var(--blue);font:inherit;padding:6px 4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tb:active{opacity:.4}.tb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#status{color:var(--mut);font-size:13px;min-height:18px;margin:0 4px 10px}
h2{font:700 22px/1.2 -apple-system,system-ui,sans-serif;margin:22px 0 12px}
.hero{display:flex;gap:16px;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 14px #0000001a;align-items:center;cursor:pointer}
.hero .cv{width:92px;flex:none}.hero .info{flex:1;min-width:0}
.hero h3{margin:0 0 2px;font:600 19px/1.2 -apple-system,system-ui,sans-serif;overflow-wrap:anywhere}
.sm{color:var(--mut);font-size:13px}
.pill{display:inline-block;margin-top:10px;background:var(--blue);color:#fff;font-weight:600;font-size:15px;padding:7px 18px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:24px 16px}
.bk{position:relative;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--fg);font:inherit}
.cv{aspect-ratio:2/3;border-radius:8px 12px 12px 8px;overflow:hidden;background:var(--card);box-shadow:0 1px 3px #0003,0 8px 20px #0002;position:relative;transition:transform .2s}
.bk:active .cv{transform:scale(.96)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 3px 0 4px #0003,inset 0 0 0 .5px #0003;pointer-events:none}
.t{margin:10px 2px 3px;font-size:14px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 2px 4px}.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.pm{font-size:12px;color:var(--mut);margin-left:2px}.pm.done{color:var(--green);font-weight:600}.pm.new{color:var(--blue);font-weight:600}
.hero .bar{margin:8px 0 4px}
.x{position:absolute;top:-8px;left:-8px;z-index:3;width:26px;height:26px;padding:0;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--bg);font:700 18px/1 system-ui;display:none;cursor:pointer}
.edit .x{display:block}
.empty{text-align:center;color:var(--mut);padding:60px 10px}
.empty b{display:block;font-size:20px;color:var(--fg);margin-bottom:6px}
#rd{position:fixed;inset:0;z-index:20;background:var(--bg);display:none}#rd.on{display:block}
.top,.bot{position:absolute;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);transition:transform .25s}
.top{top:0;padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:.5px solid var(--line)}
.bot{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--line)}
.hide .top{transform:translateY(-110%)}.hide .bot{transform:translateY(110%)}
.top b{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:600}
.top .tb{min-width:72px}
#stage{position:absolute;inset:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:calc(64px + env(safe-area-inset-top,0px)) 12px calc(78px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 85%,#808080)}
#stage.fit{align-items:center}
canvas{background:#fff;box-shadow:0 4px 24px #0003;border-radius:2px;display:block;max-width:none}
#sl{flex:1;min-width:0;accent-color:var(--blue)}
#pn{font-size:13px;color:var(--mut);min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
#ld{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mut);z-index:3}
dialog{border:0;border-radius:20px 20px 0 0;background:var(--bg);color:var(--fg);width:min(560px,100vw);max-width:100vw;margin:auto auto 0;padding:0 0 calc(18px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:#0006;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}.sh b{font-size:17px}
.grp{margin:12px 16px;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;min-height:46px}
.row+.row{border-top:.5px solid var(--line)}
.row input[type=time]{font:inherit;color:var(--blue);background:transparent;border:0}
.row .tb{padding:0}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:#78788052;position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .2s}
.sw:checked{background:var(--green)}.sw:checked::after{transform:translateX(20px)}
.note{margin:6px 32px 0;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div class="nav">
  <button class="tb" id="edit">Edit</button>
  <div><button class="tb" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="tb" id="add" aria-label="Add books"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
</div>
<input type="file" id="fi" accept="application/pdf,.pdf" multiple hidden>
<div class="wrap"><h1>Library</h1><div id="status"></div><div id="home"></div></div>
<div id="rd">
  <div class="top"><button class="tb" id="back">‹ Library</button><b id="rt"></b><span style="min-width:72px"></span></div>
  <div id="stage" class="fit"><canvas id="cv"></canvas></div><div id="ld">Opening…</div>
  <div class="bot"><button class="tb" id="pv" aria-label="Previous">‹</button><input type="range" id="sl" min="1" value="1"><span id="pn"></span><button class="tb" id="nx" aria-label="Next">›</button></div>
</div>
<dialog id="set">
  <div class="sh"><b>Settings</b><button class="tb" id="sdone">Done</button></div>
  <div class="grp">
    <div class="row"><span>Keep screen on while reading</span><input type="checkbox" class="sw" id="wake"></div>
    <div class="row"><span>Daily reading reminder</span><input type="checkbox" class="sw" id="rem"></div>
    <div class="row"><span>Reminder time</span><input type="time" id="rtime"></div>
    <div class="row"><button class="tb" id="test">Send a test notification</button></div>
  </div>
  <div class="note" id="env"></div>
</dialog>
<script>
const $=id=>document.getElementById(id);
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const cap=window.Capacitor,native=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform()),P=(cap&&cap.Plugins)||{};
let db=null,mem={meta:new Map(),files:new Map()},metas=[],pdf=null,cur=null,page=1,task=null,rt=0,fitPage=true,saveT=0,wl=null,webT=0,editing=false;
let S={wake:true,remind:false,time:"20:00"};try{Object.assign(S,JSON.parse(localStorage.getItem("shelf-set")||"{}"))}catch(e){}
const saveS=()=>{try{localStorage.setItem("shelf-set",JSON.stringify(S))}catch(e){}};
const say=(t,err)=>{$("status").textContent=t;$("status").style.color=err?"var(--red)":"var(--mut)"};
/* storage */
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function init(){try{db=await new Promise((res,rej)=>{const q=indexedDB.open("shelf-library",1);q.onupgradeneeded=()=>{q.result.createObjectStore("meta",{keyPath:"id"});q.result.createObjectStore("files")};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){db=null;say("Saving isn’t available here, so books last only until you close this page.",1)}}
const st=(n,m="readonly")=>db.transaction(n,m).objectStore(n);
async function allMeta(){try{return db?await req(st("meta").getAll()):[...mem.meta.values()]}catch(e){return[...mem.meta.values()]}}
async function putMeta(m){try{if(db)await req(st("meta","readwrite").put(m));else mem.meta.set(m.id,m)}catch(e){mem.meta.set(m.id,m)}}
async function putFile(id,b){try{if(db)await req(st("files","readwrite").put(b,id));else mem.files.set(id,b)}catch(e){mem.files.set(id,b);throw e}}
async function getFile(id){try{return db?await req(st("files").get(id)):mem.files.get(id)}catch(e){return mem.files.get(id)}}
async function delBook(id){try{if(db){await req(st("meta","readwrite").delete(id));await req(st("files","readwrite").delete(id))}}catch(e){}mem.meta.delete(id);mem.files.delete(id)}
/* library */
const pct=m=>m.page>=m.pages?100:Math.round(m.page/m.pages*100);
function bookEl(m,hero){const b=document.createElement(hero?"div":"button"),op=m.opened,dn=op&&m.page>=m.pages;
  b.className=hero?"hero":"bk";
  b.innerHTML='<div class="cv"><img alt=""></div>'+(hero?'<div class="info"><div class="sm">Continue Reading</div><h3></h3><div class="bar"><i></i></div><div class="sm pp"></div><span class="pill">Resume</span></div>':'<div class="t"></div><div class="bar"><i></i></div><div class="pm"></div>');
  b.querySelector("img").src=m.cover;b.querySelector(hero?"h3":".t").textContent=m.title;
  b.querySelector(".bar i").style.width=(op?pct(m):0)+"%";
  const pp=b.querySelector(hero?".pp":".pm");pp.textContent=!op?(hero?"":"New"):dn?"Finished":hero?`Page ${m.page} of ${m.pages} · ${pct(m)}%`:pct(m)+"%";
  if(!hero)pp.classList.add(!op?"new":dn?"done":"x0");
  if(!hero&&!op)b.querySelector(".bar").style.display="none";
  b.onclick=()=>openBook(m.id);
  if(!hero){const x=document.createElement("span");x.className="x";x.textContent="−";x.onclick=async e=>{e.stopPropagation();if(confirm("Remove “"+m.title+"” from your library?")){await delBook(m.id);await refresh()}};b.appendChild(x)}
  return b}
async function refresh(){metas=(await allMeta()).sort((a,b)=>b.added-a.added);const h=$("home");h.innerHTML="";h.classList.toggle("edit",editing);
  if(!metas.length){h.innerHTML='<div class="empty"><b>No Books Yet</b>Tap + to add PDFs from your device.</div>';applyReminder();return}
  const last=metas.filter(m=>m.opened&&m.page<m.pages).sort((a,b)=>b.last-a.last)[0];
  if(last)h.appendChild(bookEl(last,true));
  const s=document.createElement("h2");s.textContent="All Books";const g=document.createElement("div");g.className="grid";metas.forEach(m=>g.appendChild(bookEl(m)));h.append(s,g);applyReminder()}
async function addFiles(files){for(const f of files){if(!/\.pdf$/i.test(f.name)&&!/pdf$/i.test(f.type)){say("“"+f.name+"” isn’t a PDF.",1);continue}
  say("Adding "+f.name+"…");
  try{const d=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,pg=await d.getPage(1);
    const v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:360/v0.width}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    let title=f.name.replace(/\.pdf$/i,"").replace(/[_-]+/g," ");
    try{const md=await d.getMetadata(),t=md.info&&md.info.Title;if(t&&t.trim().length>2&&t.length<90)title=t.trim()}catch(e){}
    const m={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,pages:d.numPages,page:1,opened:false,cover:c.toDataURL("image/jpeg",.82),added:Date.now(),last:0};d.destroy();
    let ok=true;try{await putFile(m.id,f)}catch(e){ok=false}
    await putMeta(m);await refresh();say(ok?"Added “"+title+"”.":"Couldn’t save “"+title+"” permanently (storage full?). It lasts this session only.",!ok)}
  catch(e){say("Couldn’t read “"+f.name+"”. It may be damaged or password-protected.",1)}}}
/* keep screen on */
async function wakeOn(){if(!S.wake)return;try{if(native&&P.KeepAwake)await P.KeepAwake.keepAwake();else if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
async function wakeOff(){try{if(native&&P.KeepAwake)await P.KeepAwake.allowSleep()}catch(e){}try{if(wl){await wl.release();wl=null}}catch(e){}}
/* reminders */
function remText(){const m=metas.filter(x=>x.opened&&x.page<x.pages).sort((a,b)=>b.last-a.last)[0];return{title:"Time to read",body:m?`Pick up “${m.title}” at page ${m.page} (${pct(m)}% done).`:"Open Shelf and start your next book."}}
async function askPerm(){if(native&&P.LocalNotifications){try{return(await P.LocalNotifications.requestPermissions()).display==="granted"}catch(e){return false}}
  if("Notification" in window){try{return(await Notification.requestPermission())==="granted"}catch(e){}}return false}
async function applyReminder(){clearTimeout(webT);const[h,mi]=S.time.split(":").map(Number),r=remText();
  if(native&&P.LocalNotifications){try{await P.LocalNotifications.cancel({notifications:[{id:1}]});if(S.remind)await P.LocalNotifications.schedule({notifications:[{id:1,title:r.title,body:r.body,schedule:{on:{hour:h,minute:mi},allowWhileIdle:true}}]})}catch(e){}return}
  if(S.remind&&"Notification" in window&&Notification.permission==="granted"){const d=new Date();d.setHours(h,mi,0,0);if(d<=new Date())d.setDate(d.getDate()+1);
    webT=setTimeout(()=>{try{new Notification(r.title,{body:r.body})}catch(e){}applyReminder()},Math.min(d-Date.now(),2147483000))}}
$("gear").onclick=()=>{$("wake").checked=S.wake;$("rem").checked=S.remind;$("rtime").value=S.time;
  $("env").textContent=native?"Running as the Android app. Reminders arrive even when Shelf is closed.":"In a browser, reminders only fire while this page is open. Install the Android app for reliable reminders.";$("set").showModal()};
$("sdone").onclick=()=>$("set").close();
$("wake").onchange=e=>{S.wake=e.target.checked;saveS();if(!S.wake)wakeOff();else if($("rd").classList.contains("on"))wakeOn()};
$("rem").onchange=async e=>{if(e.target.checked){const ok=await askPerm();if(!ok){e.target.checked=false;S.remind=false;$("env").textContent="Notifications are blocked or unavailable here. They work in the Android app."}else S.remind=true}else S.remind=false;saveS();applyReminder()};
$("rtime").onchange=e=>{if(e.target.value){S.time=e.target.value;saveS();applyReminder()}};
$("test").onclick=async()=>{if(!await askPerm()){$("env").textContent="Notifications are blocked or unavailable here. They work in the Android app.";return}const r=remText();
  try{if(native&&P.LocalNotifications)await P.LocalNotifications.schedule({notifications:[{id:2,title:r.title,body:r.body,schedule:{at:new Date(Date.now()+2000)}}]});else new Notification(r.title,{body:r.body});$("env").textContent="Test sent."}catch(e){$("env").textContent="Couldn’t send a notification here."}};
/* reader */
function saveNow(){clearTimeout(saveT);if(cur){cur.page=page;cur.last=Date.now();cur.opened=true;putMeta(cur)}}
const queueSave=()=>{clearTimeout(saveT);saveT=setTimeout(saveNow,350)};
async function openBook(id){const m=metas.find(x=>x.id===id);if(!m)return;
  $("rd").classList.remove("hide");$("rd").classList.add("on");$("rt").textContent=m.title;$("ld").style.display="flex";document.body.style.overflow="hidden";
  try{const f=await getFile(id);if(!f)throw 0;pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise}
  catch(e){closeReader();say("That book’s file couldn’t be loaded. Try adding it again.",1);return}
  cur=m;$("sl").max=m.pages;page=Math.min(Math.max(1,m.page||1),m.pages);$("ld").style.display="none";m.opened=true;wakeOn();show(page)}
async function show(n){if(!pdf)return;n=Math.min(Math.max(1,n),pdf.numPages);page=n;$("sl").value=n;
  $("pn").textContent=`${n} of ${pdf.numPages} · ${n>=pdf.numPages?100:Math.round(n/pdf.numPages*100)}%`;$("pv").disabled=n<=1;$("nx").disabled=n>=pdf.numPages;queueSave();
  const my=++rt;if(task){task.cancel();try{await task.promise}catch(e){}}if(my!==rt||!pdf)return;
  const pg=await pdf.getPage(n),sg=$("stage"),v0=pg.getViewport({scale:1});
  let sc=(sg.clientWidth-24)/v0.width;if(fitPage)sc=Math.min(sc,(sg.clientHeight-150)/v0.height);
  const dpr=Math.min(window.devicePixelRatio||1,2),vp=pg.getViewport({scale:sc*dpr}),c=$("cv");
  c.width=vp.width;c.height=vp.height;c.style.width=vp.width/dpr+"px";c.style.height=vp.height/dpr+"px";sg.scrollTop=0;
  task=pg.render({canvasContext:c.getContext("2d"),viewport:vp});try{await task.promise}catch(e){}}
function closeReader(){saveNow();rt++;if(task)task.cancel();if(pdf){pdf.destroy();pdf=null}cur=null;wakeOff();$("rd").classList.remove("on");document.body.style.overflow="";refresh()}
$("back").onclick=closeReader;$("pv").onclick=()=>show(page-1);$("nx").onclick=()=>show(page+1);$("sl").oninput=e=>show(+e.target.value);
$("stage").addEventListener("click",e=>{if(e.target.id!=="cv")return;const r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  if(x<.3)show(page-1);else if(x>.7)show(page+1);else $("rd").classList.toggle("hide")});
let tx0=null;$("stage").addEventListener("touchstart",e=>{tx0=e.touches[0].clientX},{passive:true});
$("stage").addEventListener("touchend",e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;const s=$("stage");if(s.scrollWidth<=s.clientWidth+2){if(dx<-70)show(page+1);else if(dx>70)show(page-1)}});
document.addEventListener("keydown",e=>{if(!$("rd").classList.contains("on"))return;if(e.key==="ArrowRight"||e.key==="PageDown")show(page+1);else if(e.key==="ArrowLeft"||e.key==="PageUp")show(page-1);else if(e.key==="Escape")closeReader()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveNow();else if($("rd").classList.contains("on"))wakeOn()});addEventListener("pagehide",saveNow);
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(pdf)show(page)},200)});
$("add").onclick=()=>$("fi").click();$("fi").onchange=e=>{addFiles([...e.target.files]);e.target.value=""};
$("edit").onclick=()=>{editing=!editing;$("edit").textContent=editing?"Done":"Edit";$("home").classList.toggle("edit",editing)};
